name: Pipeline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Check template JavaScript syntax
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("references/report-template.html","utf8"); new Function(html.match(/<script>([\s\S]*?)<\/script>/)[1]);'
