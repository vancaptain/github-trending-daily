<style>
:root{

  --border:#30363d; --border2:#3d444d;
  --fg:#e6edf3; --fg2:#9198a1; --fg3:#6e7681;
  --accent:#e3b341; --accent2:#d97706; --blue:#4493f8; --green:#3fb950; --red:#f85149; --purple:#ab7df8;

}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(1,4,9,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hd{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.hd h1{font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.hd .octo{width:26px;height:26px;fill:var(--fg)}
.date-pill{font:600 12px/1 ui-monospace,Consolas,monospace;color:var(--accent);border:1px solid #4a3f1e;background:#201a08;border-radius:99px;padding:6px 12px}
.spacer{flex:1}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lang-toggle button{background:transparent;border:0;color:var(--fg2);padding:7px 14px;font-size:13px;font-weight:600;transition:background .15s,color .15s}
.lang-toggle button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0 16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px}
.stat .v{font:700 24px/1.2 ui-monospace,Consolas,monospace;margin-top:4px}
.stat .v.gold{color:var(--accent)} .stat .v.blue{color:var(--blue)} .stat .v.green{color:var(--green)} .stat .v.purple{color:var(--purple)}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--fg3)}
.search input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:9px 12px 9px 34px;font-size:14px}
.search input::placeholder{color:var(--fg3)}
.search input:focus{border-color:var(--blue);outline:none}
select{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:9px 10px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--card);border:1px solid var(--border);color:var(--fg2);border-radius:99px;padding:6px 14px;font-size:13px;transition:all .15s}
.chip:hover{border-color:var(--border2);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--border2)}
.card.top3{border-color:#4a3f1e;background:linear-gradient(180deg,#1d1a10,var(--card) 45%)}
.card-head{display:flex;align-items:flex-start;gap:10px}
.rank{font:800 13px/1 ui-monospace,Consolas,monospace;color:var(--bg);background:var(--fg3);border-radius:6px;padding:5px 8px;flex-shrink:0;margin-top:2px}
.card:nth-child(1) .rank{background:var(--accent)} .card:nth-child(2) .rank{background:#b8c4ce} .card:nth-child(3) .rank{background:#c77b3d}
.rname{font:600 16px/1.35 ui-monospace,Consolas,monospace;word-break:break-all}
.rname a{color:var(--fg)} .rname a:hover{color:var(--blue)}
.today{margin-left:auto;flex-shrink:0;text-align:right}
.today .n{font:800 17px/1 ui-monospace,Consolas,monospace;color:var(--accent);white-space:nowrap}
.today .l{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px}
.meta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--fg2);flex-wrap:wrap}
.lang-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.stars-t{display:inline-flex;align-items:center;gap:4px}
.stars-t svg{width:13px;height:13px;fill:var(--fg2)}
.tag{font-size:11px;color:var(--purple);border:1px solid #3b2f58;background:#1b1630;border-radius:99px;padding:2px 9px}
.sec{font-size:13.5px}
.sec b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin-bottom:3px;font-weight:700}
.sec ul{margin:0;padding-left:18px;color:var(--fg2)}
.sec ul li{margin:2px 0}
.sec p{color:var(--fg2)}
.warn b{color:#d29922}
.osrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.os{font-size:11.5px;font-weight:600;border-radius:5px;padding:3px 9px;background:#12261e;color:#4dd880;border:1px solid #1d4433}
.os.na{background:#241024;color:#e57dd1;border-color:#4d1d47}
.os.info{background:#0f2333;color:#6cb6ff;border-color:#1c3a56}
.card-foot{margin-top:auto;padding-top:8px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center}
.card-foot a{font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.card-foot svg{width:13px;height:13px;fill:currentColor}

/* table */
h2.sec-title{font-size:17px;margin:34px 0 4px}
.sub{color:var(--fg2);font-size:13px;margin-bottom:12px}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th[aria-sort="ascending"] button::after{content:" ↑";color:var(--accent)}
th[aria-sort="descending"] button::after{content:" ↓";color:var(--accent)}
th button{background:none;border:0;color:inherit;font:inherit;text-align:inherit;width:100%}
th{position:sticky;top:0;background:var(--card2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg2);padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th .arr{font-size:10px;color:var(--accent)}
td{padding:9px 14px;border-bottom:1px solid #21262d;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#1a2130}
td.num{font:600 12.5px ui-monospace,Consolas,monospace;white-space:nowrap}
td .d{color:var(--fg2)}
.todaycell{color:var(--accent);font-weight:700}
footer{margin-top:40px;color:var(--fg3);font-size:12px;text-align:center;line-height:1.8}
.count-note{font-size:12.5px;color:var(--fg3);margin:0 0 10px}
.empty{padding:40px;text-align:center;color:var(--fg2)}
.os-group{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 6px 2px 0}
.evidence{font-size:12px;overflow-wrap:anywhere;color:var(--fg2)}
@media(max-width:520px){.wrap{padding:0 12px}.hd{padding:12px}.card{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.search{min-width:0;flex-basis:100%}.today .n{font-size:15px}.rname{font-size:14px}.card-head{gap:7px}.lang-toggle{margin-left:auto}}

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function validURL(url){ try { const u = new URL(url); return u.protocol === "https:" && !u.username && !u.password; } catch (_) { return false; } }
function evidenceHTML(r){
  const links = (r.sources || []).filter(s => validURL(s.url)).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label?.[curLang] || s.url)}</a>`);
  return links.length ? `<div class="evidence">${curLang==="zh"?"解读来源":"Analysis sources"}: ${links.join(" · ")}</div>` : "";
}
function scopeLabel(){
  return REPORT.scope === "demo" ? (curLang==="zh"?"历史示例，数据与兼容性未复核":"Historical example; data and compatibility unverified")
    : REPORT.scope === "overall" ? (curLang==="zh"?"GitHub Trending 总榜快照":"GitHub Trending overall-board snapshot")
    : (curLang==="zh"?"总榜 + 所选语言分榜的聚合样本，非总榜还原":"Overall + selected language-board sample; not a reconstruction of the overall board");
}
function sourceFooter(){
  const scope = scopeLabel();
  const links = (REPORT.sources || []).filter(s => validURL(s.url)).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.fetched_at)}">${esc(s.language || (curLang==="zh"?"总榜":"Overall"))}</a>`).join(" · ");
  const time = REPORT.fetched_at ? ` · ${curLang==="zh"?"抓取":"Fetched"}: ${esc(REPORT.fetched_at)}` : "";
  const note = curLang==="zh"?"计数为抓取快照；有安装包不代表已实测运行。未编辑项目保留官方原文。":"Counts are fetch-time snapshots; packages do not prove tested compatibility. Unedited descriptions retain the official source language.";
  return `${esc(scope)}${time}<br>${links}<br>${note}`;
}

function applyLang(){
  const t = I18N[curLang];
  document.documentElement.lang = curLang === "zh" ? "zh-CN" : "en";
  $("pageTitle").textContent = t.title;
  $("datePill").textContent = REPORT.date;

  $("featuredTitle").textContent = curLang==="zh" ? "精选解读" : "Featured analysis";
  $("featuredSub").textContent = t.featSub;
  $("featuredTitle").hidden = $("featuredSub").hidden = $("cards").hidden = DATA.length === 0;
  $("scopeNote").textContent = scopeLabel();
  $("q").placeholder = t.ph;
  $("moreTitle").textContent = curLang==="zh" ? "榜单项目 · 其余项目" : "Ranking · Remaining projects";
  $("moreSub").textContent = t.moreSub;
  $("footer").innerHTML = sourceFooter();
  $("btnZh").setAttribute("aria-pressed", curLang==="zh");
  $("btnEn").setAttribute("aria-pressed", curLang==="en");
  $("q").setAttribute("aria-label", t.ph);
  $("langFilter").setAttribute("aria-label", curLang==="zh"?"编程语言筛选":"Programming language filter");
  $("sortSel").setAttribute("aria-label", curLang==="zh"?"排序":"Sort");
  const labels = curLang==="zh" ? ["今日 Star ↓","总 Star ↓","名称 A-Z"] : ["Stars today ↓","Total stars ↓","Name A-Z"];
  Array.from($("sortSel").options).forEach((o,i) => o.textContent=labels[i]);
  const tableLabels = curLang==="zh" ? ["序号","项目","简介","语言","今日 ★","总 ★"] : ["Position","Repo","Description","Language","Today ★","Total ★"];
  document.querySelectorAll("#tbl th").forEach((th,i) => th.querySelector("button").textContent=tableLabels[i]);
  updateSortHeaders();
  renderStats(); renderChips(); renderLangFilter(); renderAll();
}

function allRepos(){ return DATA.concat(MORE); }

function renderStats(){
  const t = I18N[curLang];
  const all = allRepos();
  const sumToday = all.reduce((s,r)=>s+r.today,0);
  const top = Math.max(0, ...all.map(r=>r.today));
  const classified = all.filter(r=>r.cat!=="uncategorized").length;
  const aiCount = all.filter(r=>["skill","agent","rag","model"].includes(r.cat)).length;
  $("stats").innerHTML = [
    {k:t.s1, v:all.length, c:"blue"},
    {k:t.s2, v:fmt(sumToday), c:"gold"},
    {k:t.s3, v:fmt(top)+" ★", c:"green"},
    {k:t.s4, v:classified ? Math.round(aiCount/all.length*100)+"%" : "—", c:"purple", note:curLang==="zh"?`已分类 ${classified}/${all.length}`:`Classified ${classified}/${all.length}`}
  ].map(s=>`<div class="stat"><div class="k">${s.k}</div><div class="v ${s.c}">${s.v}</div>${s.note?`<div class="k">${s.note}</div>`:""}</div>`).join("");
}

function renderChips(){
  const t = I18N[curLang];
  const cats = ["all", ...new Set(allRepos().map(r=>r.cat))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===curCat}">${esc(t.cats[c]||c)}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ curCat = b.dataset.cat; renderChips(); renderAll(); };
  });
}

function renderLangFilter(){
  const langs = ["all", ...new Set(allRepos().map(r=>r.lang).filter(Boolean))].sort((a,b)=>a==="all"?-1:b==="all"?1:a.localeCompare(b));
  const cur = curLangFilter;
  $("langFilter").innerHTML = langs.map(l=>`<option value="${esc(l)}" ${l===cur?"selected":""}>${l==="all"?(curLang==="zh"?"全部语言":"All languages"):esc(l)}</option>`).join("");
}

function matches(r){
  if(curCat!=="all" && r.cat!==curCat) return false;
  if(curLangFilter!=="all" && r.lang!==curLangFilter) return false;
  if(curQ){
    const q = curQ.toLowerCase();
    const hay = (r.name+" "+r.d.zh+" "+r.d.en+" "+Object.values(r.purpose||{}).join(" ")+" "+Object.values(r.feats||{}).flat().join(" ")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function osBadges(r){
  const t = I18N[curLang];
  const evidenceFor = o => (r.os_evidence||[]).find(e=>e.os===o && validURL(e.url));
  const platforms = (r.os||[]).filter(o => ["win","mac","linux","android","ios"].includes(o) && evidenceFor(o));
  const runtimes = [...new Set([...(r.runtime||[]), ...(r.os||[]).filter(o=>["cli","docker","web","none","hardware"].includes(o))])];
  const badge = (o, runtime) => {
    const evidence = evidenceFor(o);
    const note = evidence?.note?.[curLang] || (curLang==="zh"?"运行方式，不代表系统兼容性":"Runtime type, not OS compatibility");
    const label = t.osLabel[o] || o;
    return evidence ? `<a class="os ${runtime?"info":""}" href="${esc(evidence.url)}" title="${esc(note)}" target="_blank" rel="noopener">${esc(label)}</a>`
      : `<span class="os info" title="${esc(note)}">${esc(label)}</span>`;
  };
  const unknown = `<span class="os info">${curLang==="zh"?"待确认":"Unverified"}</span>`;
  const platformHTML = `<span class="os-group"><span class="evidence">${curLang==="zh"?"操作系统":"OS"}:</span>${platforms.length?platforms.map(o=>badge(o,false)).join(""):unknown}</span>`;
  const runtimeHTML = runtimes.length ? `<span class="os-group"><span class="evidence">${curLang==="zh"?"运行方式":"Runtime"}:</span>${runtimes.map(o=>badge(o,true)).join("")}</span>` : "";
  return platformHTML + runtimeHTML;
}

function cardHTML(r, idx){
  const t = I18N[curLang];
  const dot = LANG_COLORS[r.lang]||"#8b949e";
  const warn = curLang==="zh" ? r.warns.zh : r.warns.en;
  const purp = curLang==="zh" ? r.purpose.zh : r.purpose.en;
  const feats = curLang==="zh" ? r.feats.zh : r.feats.en;
  return `<article class="card ${idx<3?"top3":""}">
    <div class="card-head">
      <span class="rank" aria-label="rank ${idx+1}">${idx+1}</span>
      <h3 class="rname"><a href="https://github.com/${esc(r.name)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
      <div class="today"><div class="n">+${fmt(r.today)}</div><div class="l">★ ${t.today}</div></div>
    </div>
    <div class="meta">
      <span><span class="lang-dot" style="background:${dot}"></span>${esc(r.lang||"—")}</span>
      <span class="stars-t"><svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>${fmt(r.total)} ${t.stars}</span>
      <span class="tag">${esc(t.cats[r.cat]||r.cat)}</span>
    </div>
    <p class="sec">${esc(curLang==="zh"?r.d.zh:r.d.en)}</p>
    <div class="sec"><b>${t.pPurpose}</b><p>${esc(purp)}</p></div>
    <div class="sec"><b>${t.pFeats}</b><ul>${feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>
    <div class="sec warn"><b>${t.pWarns}</b><ul>${warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <div class="sec"><b>${t.pOs}</b><div class="osrow">${osBadges(r)}</div></div>
    ${evidenceHTML(r)}
    <div class="card-foot">
      <a href="https://github.com/${esc(r.name)}" target="_blank" rel="noopener">github.com/${esc(r.name)} →</a>
      <a href="https://github.com/${esc(r.name)}/releases" target="_blank" rel="noopener">Releases →</a>
    </div>
  </article>`;
}

function renderCards(){
  const t = I18N[curLang];
  let rows = DATA.filter(matches);
  if(curSort==="today") rows.sort((a,b)=>b.today-a.today);
  else if(curSort==="total") rows.sort((a,b)=>b.total-a.total);
  else rows.sort((a,b)=>a.name.localeCompare(b.name));
  $("cards").innerHTML = rows.length ? rows.map((r,i)=>cardHTML(r,i)).join("")
    : `<div class="empty">${curLang==="zh"?"没有匹配的项目":"No matching projects"}</div>`;
}

function renderTable(){
  const t = I18N[curLang];
  let rows = MORE.filter(matches);
  const {k,dir} = tblSort;
  rows.sort((a,b)=>{
    let va = k==="rank"? a.today : k==="desc"? a.d[curLang] : a[k], vb = k==="rank"? b.today : k==="desc"? b.d[curLang] : b[k];
    if(typeof va === "string") return dir * va.localeCompare(vb, curLang==="zh"?"zh-CN":"en") || a.name.localeCompare(b.name);
    return dir * (va-vb) || a.name.localeCompare(b.name);
  });
  $("tbody").innerHTML = rows.length ? rows.map((r,i)=>`
    <tr>
      <td class="num">${i+1}</td>
      <td><a href="https://github.com/${esc(r.name)}" target="_blank" rel="noopener" style="font-family:ui-monospace,Consolas,monospace;font-size:13px">${esc(r.name)}</a></td>
      <td><span class="d">${esc(curLang==="zh"?r.d.zh:r.d.en)}</span> ${osBadges(r)} ${evidenceHTML(r)}</td>
      <td><span class="lang-dot" style="background:${LANG_COLORS[r.lang]||"#8b949e"}"></span>${esc(r.lang||"—")}</td>
      <td class="num todaycell">+${fmt(r.today)}</td>
      <td class="num">${fmt(r.total)}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">${curLang==="zh"?"没有匹配的项目":"No matching projects"}</td></tr>`;
  const n = rows.length;
  $("countNote").textContent = (curLang==="zh" ? `匹配项目：${DATA.filter(matches).length + n} · 精选 ${DATA.filter(matches).length} · 表格 ${n}` : `Matching: ${DATA.filter(matches).length + n} · Featured ${DATA.filter(matches).length} · Table ${n}`);
}

function renderAll(){ renderCards(); renderTable(); }

/* events */
$("q").addEventListener("input", e=>{ curQ = e.target.value.trim(); renderAll(); });
$("langFilter").addEventListener("change", e=>{ curLangFilter = e.target.value; renderAll(); });
function updateSortHeaders(){
  const names = curLang==="zh" ? {rank:"今日 Star",today:"今日 Star",total:"总 Star",name:"项目名",desc:"简介",lang:"语言"} : {rank:"Stars today",today:"Stars today",total:"Total stars",name:"Name",desc:"Description",lang:"Language"};
  $("moreSub").textContent = curLang==="zh" ? `按${names[tblSort.k]}${tblSort.dir===-1?"降序":"升序"} · 点击表头重新排序` : `${names[tblSort.k]} ${tblSort.dir===-1?"descending":"ascending"} · click headers to re-sort`;
  document.querySelectorAll("#tbl th").forEach(th=>{
    th.setAttribute("aria-sort", th.dataset.k===tblSort.k ? (tblSort.dir===-1?"descending":"ascending") : "none");
  });
}
$("sortSel").addEventListener("change", e=>{
  curSort = e.target.value;
  tblSort = {k:curSort==="total"?"total":curSort==="name"?"name":"today",dir:curSort==="name"?1:-1};
  updateSortHeaders(); renderAll();
});
document.querySelectorAll("#tbl th").forEach(th=>{
  const button = document.createElement("button"); button.type="button"; button.textContent=th.textContent;
  th.textContent=""; th.appendChild(button); th.setAttribute("scope","col");
  button.addEventListener("click", ()=>{
    const k = th.dataset.k;
    if(tblSort.k===k) tblSort.dir *= -1; else tblSort = {k, dir: ["name","desc","lang"].includes(k)?1:-1};
    updateSortHeaders(); renderTable();
  });
});
function setLanguage(language){
  curLang=language;
  try { localStorage.setItem("tr_lang",language); } catch (_) {}
  applyLang();
}
$("btnZh").onclick = ()=>setLanguage("zh");
$("btnEn").onclick = ()=>setLanguage("en");

applyLang();
</script>
</body>
</html>
